[pytest]
# Project root for test discovery
testpaths = backend/tests

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Add project root to PYTHONPATH so `backend.*` imports resolve
pythonpath = .

# Output formatting
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers
markers =
    integration: Integration tests that require a running DB or API
    unit: Pure unit tests with no external dependencies
    slow: Tests that take more than 2 seconds
